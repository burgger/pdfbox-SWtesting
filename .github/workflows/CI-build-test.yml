name: CI-build-test.yml
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          cache: maven
          distribution: 'temurin'

      - name: Run tests (Maven)
        run: mvn -B -ntp test -pl '!examples' -am
